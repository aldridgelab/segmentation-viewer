[project]
name = "segmentation-checker"
version = "0.1.0"
description = "Desktop review tool for correcting U-Net single-cell segmentation annotations."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.124.4",
    "pillow>=12.0.0",
    "pydantic>=2.0",
    "pywebview>=6.2.1",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pyinstaller>=6.20.0",
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
