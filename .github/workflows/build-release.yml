name: Build Release DMG

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dmg:
    name: Build macOS DMG
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: uv sync --frozen --group dev

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run backend tests
        run: uv run pytest

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Validate desktop entrypoint
        run: uv run python -m segmentation_checker.desktop --check

      - name: Build DMG
        run: SEGMENTATION_CHECKER_SKIP_INSTALL=1 bash scripts/package_app.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: AldridgeSegmentationViewer-${{ github.sha }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 30
